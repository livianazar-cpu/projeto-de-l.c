<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coin Rush</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f4f8; --fg: #1b1e33; --muted: #5b607c;
    --accent: #c77700; --panel: #e3e6f0; --border: #c8ccdd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141f; --fg: #e8e8f0; --muted: #9aa0be;
      --accent: #ffd54a; --panel: #1e2236; --border: #2b2f4a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141f; --fg: #e8e8f0; --muted: #9aa0be;
    --accent: #ffd54a; --panel: #1e2236; --border: #2b2f4a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: max(16px, env(safe-area-inset-top, 0px));
  }
  main { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font-size: 1.5rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  canvas {
    display: block; width: 100%; max-width: 960px; height: auto; aspect-ratio: 16 / 9;
    background: #000; border: 3px solid var(--border); border-radius: 8px; outline: none;
    touch-action: none;
  }
  canvas:focus-visible { border-color: var(--accent); }
  .help { margin: 0; font-size: .9rem; color: var(--muted); line-height: 1.5; }
  .help b { color: var(--fg); }
  .pad { display: flex; justify-content: space-between; gap: 12px; }
  .pad-group { display: flex; gap: 10px; }
  .pad button {
    min-width: 72px; min-height: 60px; padding: 0 18px; font: inherit; font-size: 1.3rem; font-weight: 700;
    color: var(--fg); background: var(--panel); border: 2px solid var(--border); border-radius: 10px;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .pad button:active { background: var(--border); }
  .pad button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
</head>
<body>

<main>
  <h1>Coin Rush</h1>
  <canvas id="game" width="960" height="540" tabindex="0" aria-label="Área do jogo"></canvas>
  <p class="help">
    Clique no jogo e pressione <b>Enter</b> ou <b>Espaço</b> para começar.
    <b>← →</b> ou <b>A D</b> movem, <b>Espaço</b>, <b>↑</b> ou <b>W</b> pulam, <b>R</b> reinicia.
  </p>
  <div class="pad" aria-label="Controles de toque">
    <div class="pad-group">
      <button type="button" data-key="ArrowLeft" aria-label="Esquerda">◀</button>
      <button type="button" data-key="ArrowRight" aria-label="Direita">▶</button>
    </div>
    <div class="pad-group">
      <button type="button" data-key="Space" aria-label="Pular">PULAR</button>
    </div>
  </div>
</main>

<script>
/* =====================================================
   Coin Rush — v1.1 (Parte 2: testes, correções e documentação)
   Plataforma 2D em Canvas + JavaScript puro.
   Correções marcadas com // [FIX]
   ===================================================== */
(() => {
  'use strict';

  // ---------- Configuração ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  const WORLD_W = 3700;
  const GRAVITY = 2000;
  const MAX_SPEED = 280;
  const ACCEL = 2200;
  const FRICTION = 2600;
  const JUMP_V = -760;
  const COYOTE_TIME = 0.10;
  const JUMP_BUFFER = 0.12;
  const START_LIVES = 3;
  const START_TIME = 120;
  const GROUND_Y = 470;

  // [FIX 1] Sistema de fases
  const TOTAL_LEVELS = 3;
  let currentLevel = 1;

  // ---------- Entrada ----------
  const keys = Object.create(null);
  let jumpBuffer = 0;

  const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
  const BLOCK_KEYS = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];

  addEventListener('keydown', (e) => {
    if (BLOCK_KEYS.includes(e.code)) e.preventDefault();
    if (e.repeat) return;
    keys[e.code] = true;

    if (JUMP_KEYS.includes(e.code)) jumpBuffer = JUMP_BUFFER;

    // [FIX 1] ENTER: começar / avançar de fase
    if (e.code === 'Enter' && (state === 'menu' || state === 'lost')) {
      resetGame(true);
      state = 'playing';
    }
    if (e.code === 'Enter' && state === 'won') {
      if (currentLevel < TOTAL_LEVELS) {
        currentLevel++;
        resetGame(false);
        state = 'playing';
      } else {
        currentLevel = 1;
        resetGame(true);
        state = 'playing';
      }
    }
    if (e.code === 'KeyR') {
      resetGame(false);
      state = 'playing';
    }
    if (e.code === 'Space' && state === 'menu') {
      resetGame(true);
      state = 'playing';
    }
  });
  addEventListener('keyup', (e) => { keys[e.code] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
